name: My First Workflow
on:
  push:
    branches:
      - main
jobs:
  MyFirsJob:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Hello World !"

      - name: Checkout
        uses: actions/checkout@v6-beta
      - name: List files in repository
        run: |
            echo "The repository ${{ github.repository }} contains the following files:"
            tree
      - run: echo '### Hello world! :rocket:' >> $GITHUB_STEP_SUMMARY
      - run: echo '### Love this feature! :medal_sports:' >> $GITHUB_STEP_SUMMARY
      - run: echo '<h1>Great feature!</h1>' >> $GITHUB_STEP_SUMMARY
  generate-a-secret-output:
    runs-on: ubuntu-latest
    steps:
      - id: sets-a-secret
        name: Generate, mask, and output a secret
        run: |
          the_secret=$((RANDOM))
          echo "::add-mask::$the_secret"
          echo "secret-number=$the_secret" >> "$GITHUB_OUTPUT"
      - name: Use that secret output (protected by a mask)
        run: |
          echo "the secret number is ${{ steps.sets-a-secret.outputs.secretnumber }}"
