name: My First Workflow
on:
  push:
    branches:
      - main
jobs:
  MyFirsJob:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Hello World !"

      - name: Checkout
        uses: actions/checkout@v6-beta
      - name: List files in repository
        run: |
            echo "The repository ${{ github.repository }} contains the following files:"
            tree
      - run: echo '### Hello world! :rocket:' >> $GITHUB_STEP_SUMMARY
      - run: echo '### Love this feature! :medal_sports:' >> $GITHUB_STEP_SUMMARY
      - run: echo '<h1>Great feature!</h1>' >> $GITHUB_STEP_SUMMARY
      - uses: actions/github-script@v6.1.0
        with:
          script: |
            await core.summary.addHeading('Test Results').addTable([[{data: 'File', header: true}, {data: 'Result', header: true}], ['foo.js', 'Pass ✅'],
            ['bar.js', 'Fail ❌'],
            ['test.js', 'Pass ✅'] ])
            .addLink('View staging deployment!', 'https://github.com')
            .write()
